name: Test node Project
on:
  push:
    branches:
    - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  Build:
    needs: test
    runs-on:  ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
  Deploy:
    needs: Build
    runs-on:  ubuntu-latest
    steps:
      - name: Get build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-file
      - name: list files
        run: ls -la
      - name: Deploy
        run: echo "Deploying......................."